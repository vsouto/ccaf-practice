<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gap-Fill Quiz · 8 New Questions</title>
<style>
  :root{
    --bg:#faf9f7; --card:#fff; --ink:#1f1d1a; --muted:#6b655d;
    --accent:#c8613a; --accent-dark:#a24a29; --line:#e8e3dc;
    --green:#2e7d4f; --green-bg:#e9f6ee; --red:#c0392b; --red-bg:#fbeceb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}
  h1{font-size:26px;margin:0 0 4px;}
  .sub{color:var(--muted);margin:0 0 24px;font-size:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .scenario{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--accent-dark);font-weight:700;margin-bottom:8px;}
  .qtext{font-weight:600;margin:0 0 14px;}
  .opts{list-style:none;margin:0;padding:0;}
  .opt{border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-bottom:8px;
    cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:.12s;}
  .opt:hover{border-color:var(--accent);background:#fdf6f2;}
  .opt.sel{border-color:var(--accent);background:#fbeee7;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt .ltr{font-weight:700;color:var(--muted);flex:none;width:18px;}
  .opt.correct .ltr{color:var(--green);} .opt.wrong .ltr{color:var(--red);}
  .locked .opt{cursor:default;} .locked .opt:hover{background:inherit;}
  .expl{margin-top:12px;padding:12px 14px;border-radius:9px;background:#f4f1ec;
    font-size:14px;color:#3d3a34;display:none;}
  .expl.show{display:block;}
  .expl b{color:var(--ink);}
  .bar{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;
    border-bottom:1px solid var(--line);margin-bottom:20px;display:flex;
    justify-content:space-between;align-items:center;gap:12px;}
  .prog{font-size:13px;color:var(--muted);}
  button{font:inherit;font-weight:600;border:none;border-radius:9px;padding:10px 20px;
    background:var(--accent);color:#fff;cursor:pointer;}
  button:hover{background:var(--accent-dark);}
  button.ghost{background:transparent;color:var(--accent-dark);border:1px solid var(--line);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .result{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:26px;text-align:center;display:none;}
  .result.show{display:block;}
  .score{font-size:44px;font-weight:800;margin:4px 0;}
  .verdict{font-weight:700;font-size:18px;}
  .verdict.pass{color:var(--green);} .verdict.fail{color:var(--red);}
  .foot{color:var(--muted);font-size:13px;margin-top:8px;}
  .tag{display:inline-block;font-size:11px;background:#efe9e2;color:var(--muted);
    border-radius:6px;padding:2px 7px;margin-left:6px;font-weight:600;letter-spacing:.02em;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gap-Fill Quiz</h1>
  <p class="sub">The 8 new questions added on 2026-07-14 (Exam Guide v0.2). Under-covered spec facts across all 5 domains. Answer each, then submit.</p>

  <div class="bar">
    <span class="prog" id="prog">0 / 8 answered</span>
    <div>
      <button class="ghost" id="reset" type="button">Reset / reshuffle</button>
      <button id="submit" type="button" disabled>Submit</button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="verdict" id="verdict"></div>
    <div class="score" id="score"></div>
    <div class="foot" id="rfoot"></div>
    <div style="margin-top:16px"><button class="ghost" id="again" type="button">Run again</button></div>
  </div>

  <div id="quiz"></div>
</div>

<script>
// Correct answer is authored at index 0; options are shuffled at render time.
var QUESTIONS = [
  { domain:5, task:"5.4", scenario:"Developer Productivity with Claude",
    question:"Your multi-agent codebase-exploration system runs for hours, and occasionally a subagent process dies mid-run, forcing the whole exploration to restart from scratch. You want the coordinator to resume without re-doing completed work. What is the most reliable design?",
    options:[
      "Have each agent export its state to a known location as it works, and have the coordinator load a manifest of those states on resume.",
      "Increase each subagent's max_tokens so it can hold all prior findings in context and never needs to restart.",
      "Rely on the coordinator's conversation history, since subagents automatically inherit it and can rebuild lost state.",
      "Catch the crash and silently continue with whatever partial results are already in memory."],
    explanation:"Structured state persistence for crash recovery means each agent exports its state to a known location, and the coordinator loads a manifest on resume and injects it into agent prompts. Larger max_tokens does not survive a process death; subagents do NOT inherit coordinator history; and silently continuing on partial in-memory results loses the completed work you are trying to recover." },

  { domain:3, task:"3.1", scenario:"Code Generation with Claude Code",
    question:"Your monorepo has several packages, each with distinct standards. Your root CLAUDE.md has grown huge because it inlines every package's conventions, and maintainers say it is hard to keep current. What keeps CLAUDE.md modular while still giving each package its relevant standards?",
    options:[
      "Use the @import syntax in CLAUDE.md to reference external standards files, importing only those relevant to each package.",
      "Duplicate the full CLAUDE.md into every package directory so each is self-contained.",
      "Move all standards into a single ~/.claude/CLAUDE.md so every teammate loads them automatically.",
      "Delete the shared standards and rely on Claude to infer conventions from surrounding code."],
    explanation:"The @import syntax lets CLAUDE.md reference external files, so you can selectively include only the standards relevant to each package and keep the file modular. Duplicating the whole file creates drift; a user-level ~/.claude/CLAUDE.md is not shared with teammates via version control and applies only to you; inferring from code is unreliable." },

  { domain:2, task:"2.2", scenario:"Customer Support Resolution Agent",
    question:"Your MCP tools currently return a generic \"Operation failed\" string for every failure, so the agent retries policy violations (wasting calls) and gives up on transient timeouts (that would have succeeded). What is the best fix?",
    options:[
      "Return structured error metadata: an errorCategory (transient/validation/business/permission), an isRetryable boolean, and a human-readable description.",
      "Set isError on every failure and let the agent retry all of them a fixed number of times.",
      "Raise a fatal exception on any failure so the coordinator terminates the workflow immediately.",
      "Return an empty successful result for failures so the agent can move on without retrying."],
    explanation:"Uniform error strings prevent the agent from choosing an appropriate recovery. Returning structured metadata — errorCategory, an isRetryable flag, and a readable description — lets the agent retry transient failures and stop retrying business/validation errors. Blindly retrying everything wastes calls on non-retryable errors; terminating the whole workflow and masking failures as empty successes are both anti-patterns." },

  { domain:1, task:"1.5", scenario:"Customer Support Resolution Agent",
    question:"Your agent consumes three MCP tools that each return dates differently: one uses Unix timestamps, one ISO 8601, one numeric status codes. The model keeps misreading these heterogeneous formats. What is the most reliable way to give it consistent data?",
    options:[
      "Implement a PostToolUse hook that intercepts each tool result and normalizes the formats before the model processes them.",
      "Add a sentence to the system prompt asking the model to convert all timestamps to ISO 8601 itself.",
      "Increase max_tokens so the model has room to reason about each format on the fly.",
      "Switch tool_choice to \"any\" so the model is forced to call a normalization tool."],
    explanation:"A PostToolUse hook intercepts tool results and transforms them (e.g., normalizing Unix/ISO/numeric formats) before the model sees them — a deterministic guarantee. Prompt instructions give only probabilistic compliance; more max_tokens does not fix format inconsistency; and tool_choice controls which tool is called, not how existing results are normalized." },

  { domain:4, task:"4.4", scenario:"Claude Code for Continuous Integration",
    question:"Developers dismiss many of your automated review findings as false positives, but you have no systematic way to see which code constructs trigger the bad findings. What should you add to the structured output to enable that analysis?",
    options:[
      "A detected_pattern field on each finding recording which code construct triggered it, so dismissals can be analyzed systematically.",
      "A free-text summary at the end of the review listing everything the model looked at.",
      "A confidence score from 1-10 on each finding so low-confidence ones can be hidden.",
      "A retry of the whole review with a stricter \"be conservative\" instruction."],
    explanation:"Adding a detected_pattern field to each structured finding lets you track which code constructs produce findings and systematically analyze the ones developers dismiss — the basis for a feedback loop. A prose summary is not analyzable; self-reported confidence is poorly calibrated and hiding findings does not reveal the pattern; and a vague \"be conservative\" retry does not improve precision the way explicit criteria do." },

  { domain:3, task:"3.4", scenario:"Developer Productivity with Claude",
    question:"During a long multi-phase task, your main agent's context fills with verbose file dumps from a discovery phase, and its later answers degrade. You want the discovery done without polluting the main conversation. What is the right tool?",
    options:[
      "Use the Explore subagent to isolate the verbose discovery and return only a concise summary to the main conversation.",
      "Raise the main agent's max_tokens so the file dumps fit alongside everything else.",
      "Run /compact after every file read to keep the transcript short.",
      "Disable plan mode so the agent stops exploring and starts editing sooner."],
    explanation:"The Explore subagent isolates verbose discovery output and returns summaries, preserving main-conversation context and preventing context-window exhaustion during multi-phase work. Larger max_tokens still lets noise crowd out signal; /compact after every read is heavy-handed and lossy; disabling plan mode does not address where the verbose output goes." },

  { domain:4, task:"4.5", scenario:"Structured Data Extraction",
    question:"You must process nightly extraction batches on the Message Batches API (up to a 24-hour processing window) while guaranteeing results within a 30-hour SLA. How should you schedule submissions?",
    options:[
      "Submit on a fixed cadence no less frequent than every 6 hours, so the 24-hour processing window still fits inside the 30-hour SLA.",
      "Submit once per day; the 50% cost savings guarantees results well before 30 hours.",
      "Switch to the synchronous API, since the Batches API cannot meet any SLA.",
      "Submit everything in one large batch at the SLA deadline to minimize cost."],
    explanation:"With a 24-hour maximum processing window and a 30-hour SLA, submissions must start no more than 6 hours before their deadline (24 + 6 = 30), i.e. at least every 6 hours. The Batches API has no guaranteed latency SLA, so assuming it finishes \"well before\" 30 hours is unsafe; abandoning batch loses the 50% savings unnecessarily; and submitting at the deadline guarantees a breach." },

  { domain:1, task:"1.3", scenario:"Multi-Agent Research System",
    question:"Your coordinator needs a web-search subagent and a document-analysis subagent to run at the same time to cut latency. How do you spawn them so they execute in parallel?",
    options:[
      "Emit multiple Task tool calls in a single coordinator response, and ensure allowedTools includes \"Task\".",
      "Emit one Task call per turn across separate coordinator responses so each finishes before the next starts.",
      "Set tool_choice to \"any\" so the model decides to parallelize on its own.",
      "Rely on subagents inheriting the coordinator's context so they can coordinate their own timing."],
    explanation:"Spawning parallel subagents means emitting multiple Task tool calls in a single response (not across separate turns); the coordinator's allowedTools must include \"Task\" to invoke subagents at all. Sequential per-turn calls are exactly the serial pattern you are trying to avoid; tool_choice does not parallelize; and subagents do not inherit coordinator context." }
];

var DOMAINS = {
  1:"Agentic Architecture & Orchestration",
  2:"Tool Design & MCP Integration",
  3:"Claude Code Configuration & Workflows",
  4:"Prompt Engineering & Structured Output",
  5:"Context Management & Reliability"
};
var LETTERS = ["A","B","C","D"];
var $ = function(id){ return document.getElementById(id); };
var exam = [];      // shuffled questions with remapped correct index
var picks = [];     // user's selected option index per question
var locked = false;

function shuffle(a){
  a = a.slice();
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}

function build(){
  exam = QUESTIONS.map(function(q){
    var order = shuffle(q.options.map(function(_,i){return i;}));
    return {
      domain:q.domain, task:q.task, scenario:q.scenario, question:q.question,
      options: order.map(function(i){return q.options[i];}),
      correct: order.indexOf(0),   // authored correct answer was index 0
      explanation:q.explanation
    };
  });
  picks = exam.map(function(){return -1;});
  locked = false;
  render();
}

function render(){
  $("result").classList.remove("show");
  var html = "";
  exam.forEach(function(q,qi){
    html += '<div class="card'+(locked?' locked':'')+'" data-q="'+qi+'">';
    html += '<div class="scenario">'+q.scenario+' · Domain '+q.domain+' <span class="tag">Task '+q.task+'</span></div>';
    html += '<p class="qtext">'+(qi+1)+'. '+q.question+'</p>';
    html += '<ul class="opts">';
    q.options.forEach(function(opt,oi){
      var cls = "opt";
      if (!locked && picks[qi]===oi) cls += " sel";
      if (locked){
        if (oi===q.correct) cls += " correct";
        else if (picks[qi]===oi) cls += " wrong";
      }
      html += '<li class="'+cls+'" data-q="'+qi+'" data-o="'+oi+'">'
           + '<span class="ltr">'+LETTERS[oi]+'</span><span>'+opt+'</span></li>';
    });
    html += '</ul>';
    html += '<div class="expl'+(locked?' show':'')+'"><b>'+(picks[qi]===q.correct?'Correct.':'Answer: '+LETTERS[q.correct]+'.')+'</b> '+q.explanation+'</div>';
    html += '</div>';
  });
  $("quiz").innerHTML = html;
  if (!locked){
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(el){
      el.addEventListener('click', function(){
        var qi=+el.getAttribute('data-q'), oi=+el.getAttribute('data-o');
        picks[qi]=oi; render(); updateProg();
      });
    });
  }
  updateProg();
}

function updateProg(){
  var done = picks.filter(function(p){return p>=0;}).length;
  $("prog").textContent = done+" / "+exam.length+" answered";
  $("submit").disabled = (done !== exam.length) || locked;
}

function submit(){
  locked = true;
  var correct = 0, perD = {};
  exam.forEach(function(q,qi){
    perD[q.domain] = perD[q.domain] || {c:0,n:0};
    perD[q.domain].n++;
    if (picks[qi]===q.correct){ correct++; perD[q.domain].c++; }
  });
  var n = exam.length;
  var pct = Math.round(correct/n*100);
  var pass = pct >= 72;
  $("verdict").textContent = pass ? "Pass ✓" : "Keep drilling";
  $("verdict").className = "verdict " + (pass?"pass":"fail");
  $("score").textContent = correct+" / "+n+"  ("+pct+"%)";
  var byd = Object.keys(perD).sort().map(function(d){
    return "D"+d+" "+perD[d].c+"/"+perD[d].n;
  }).join("  ·  ");
  $("rfoot").textContent = byd + "  —  pass mark ≈ 72%. Scroll down for per-question explanations.";
  $("result").classList.add("show");
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

$("submit").addEventListener("click", submit);
$("reset").addEventListener("click", build);
$("again").addEventListener("click", build);
build();
</script>
</body>
</html>
